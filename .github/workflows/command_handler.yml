name: 텔레그램 커맨드 처리

on:
  schedule:
    - cron: '*/5 * * * *'   # 매 5분
  workflow_dispatch:

concurrency:
  group: command-handler
  cancel-in-progress: false

jobs:
  commands:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install requests

      - name: 커맨드 처리
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python check_and_send.py --commands-only

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscribers.json
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 스킵"
            exit 0
          fi
          git commit -m "Update subscribers"
          # 두 워크플로가 동시에 푸시하면 한쪽이 거부된다.
          # 실패 시 재시도하지 않으면 offset/seen 상태가 유실되므로 재시도한다.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              echo "푸시 완료 (시도 $i회)"
              exit 0
            fi
            echo "푸시 경합 감지 - 재시도 $i/5"
            sleep $((i * 5))
          done
          echo "::error::푸시 5회 실패 - 상태 저장 안 됨"
          exit 1
